# Adapted from ENCCS/sphinx-lesson-template at b44f1af72b189c1bb97014c6d88772a83e1cb691.
# Original workflow attribution: CodeRefinery sphinx-lesson-template, CC0.
name: Sphinx
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sphinx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group notebook .
      - name: Build directory HTML
        run: make dirhtml SPHINXOPTS='-W --keep-going'
      - name: Build single-page HTML
        run: make singlehtml SPHINXOPTS='-W --keep-going'
      - name: Include single-page version
        run: cp -a _build/singlehtml _build/dirhtml/singlehtml
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/dirhtml

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
