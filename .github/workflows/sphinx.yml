# Build the retained 2024 material without replacing the main Pages site.
name: Sphinx
on:
  push:
    branches: ['2024']
  pull_request:
    branches: ['2024']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install compatible documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'Sphinx==8.2.3' 'sphinx-lesson==0.8.20' 'myst-nb==1.4.0' 'sphinx_rtd_theme==3.1.0' 'sphinx_rtd_theme_ext_color_contrast==0.3.3'
      - name: Build historical directory HTML
        # Retain the archive source, including its existing Sphinx warnings.
        run: make dirhtml
