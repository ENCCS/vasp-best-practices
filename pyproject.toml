[project]
name = "vasp-best-practices"
version = "0.1.0"
description = "ENCCS VASP Best Practices training material for the 2027 event"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "sphinxcontrib-jquery>=4.1",
  "jupytext>=1.18.1",
  "myst-nb>=1.3.0",
  "sphinx>=8.2.3",
  "sphinx-evita>=0.3.1b0",
  "sphinx-lesson>=0.8.16",
  "sphinxcontrib-bibtex>=2.6.5",
]

[dependency-groups]
dev = [
  { include-group = "notebook" },
  "jupyterlab>=4.4.6",
  "jupyterlab-myst>=2.4.2",
]
# All dependencies used within Jupyter Notebooks
notebook = []

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false
